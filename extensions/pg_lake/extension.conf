DESCRIPTION="Iceberg and data lake access for PostgreSQL (Parquet, CSV, JSON via DuckDB)"
REPO="https://github.com/Snowflake-Labs/pg_lake.git"
LICENSE="Apache-2.0"
VERSION_17="v3.5.10"
VERSION_18="v3.5.10"
VCPKG_VERSION="2025.10.17"
SHARED_PRELOAD="pg_extension_base"
# Ordered transitive graph used by the layer test before creating pg_lake.
# End users can equivalently run CREATE EXTENSION pg_lake CASCADE.
DEPENDS="pg_extension_base,pg_map,pg_lake_engine,pg_lake_iceberg,btree_gist,pg_lake_table,pg_lake_copy"
COMPANION_CMD="pgduck_server --cache_dir /tmp/pg_lake_cache"
COMPANION_USER="postgres"
COMPANION_READY_CMD="for i in \$(seq 1 60); do pg_isready -h /tmp -p 5332 >/dev/null 2>&1 && break; sleep 1; done; pg_isready -h /tmp -p 5332 >/dev/null 2>&1"
CONFLICTS="pg_duckdb"
NOTES="Includes pgduck_server binary. Conflicts with pg_duckdb (both bundle DuckDB)."
