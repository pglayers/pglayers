DESCRIPTION="capture node OS metrics from PostgreSQL"
REPO="https://github.com/CrunchyData/pgnodemx"
LICENSE="Apache-2.0"
SHARED_PRELOAD="pgnodemx"
NOTES=""
APT_PACKAGE="pgnodemx"
# Disable the Kubernetes Downward API probe: outside k8s (e.g. plain Docker)
# /etc/podinfo doesn't exist and pgnodemx logs a WARNING on every backend start.
PG_CONF="pgnodemx.kdapi_enabled = off"
