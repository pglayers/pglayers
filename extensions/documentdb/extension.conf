DESCRIPTION="MongoDB-compatible document database engine built on PostgreSQL"
REPO="https://github.com/documentdb/documentdb.git"
LICENSE="MIT"
VERSION_17="v0.114-0"
VERSION_18="v0.114-0"
SHARED_PRELOAD="pg_documentdb_core,pg_documentdb,pg_documentdb_gw_host"
PG_CONF="documentdb_gateway.database = 'postgres'|documentdb_gateway.setup_configuration_file = '/etc/documentdb/gateway_config.json'"
NOTES="Requires pg_cron, pgvector, PostGIS, tsm_system_rows for full documentdb extension. Gateway listens on port 10260 (MongoDB wire protocol)."
DEPENDS="rum"
# This extension installs a prebuilt .deb from documentdb's GitHub *release*
# assets (see Dockerfile), not a source build of the git tag. Two consequences
# for the version monitor (.github/workflows/monitor-extensions.yml):
#   1. No TAG_FILTER -- track published *releases* via the Releases API, not
#      tags. Upstream pushes the git tag (e.g. v0.116-0) before the release
#      binaries exist, so tag-based tracking proposes unbuildable versions.
#   2. RELEASE_ASSET_URL -- the monitor probes this URL for the candidate
#      version (per PG major x arch) and waits, opening no PR, until the .deb
#      is actually downloadable. This closes the tag-vs-asset publish gap even
#      when a release is created before its assets finish uploading.
# Tokens: %TAG%=git tag (v0.116-0), %VER%=tag without leading v (0.116-0),
#         %PG%=PG major, %ARCH%=amd64/arm64.
RELEASE_ASSET_URL="https://github.com/documentdb/documentdb/releases/download/%TAG%/deb13-postgresql-%PG%-documentdb_%VER%_%ARCH%.deb"
