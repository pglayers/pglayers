DESCRIPTION="MongoDB-compatible document database engine built on PostgreSQL"
REPO="https://github.com/documentdb/documentdb.git"
LICENSE="MIT"
VERSION_17="v0.117-0"
VERSION_18="v0.117-0"
SHARED_PRELOAD="pg_cron,pg_documentdb_core,pg_documentdb,pg_documentdb_extended_rum,pg_documentdb_gw_host"
PG_CONF="documentdb_gateway.database = 'postgres'|documentdb_gateway.setup_configuration_file = '/etc/documentdb/gateway_config.json'"
NOTES="Requires pg_cron, pgvector, PostGIS, tsm_system_rows, and documentdb_extended_rum for the full documentdb extension. Gateway listens on port 10260 (MongoDB wire protocol)."
DEPENDS="rum"
# The Dockerfile installs the matching Debian package from PGDG APT and builds
# the gateway host from this tag. The monitor waits for this package on every
# supported PG major and architecture before proposing an update.
RELEASE_APT_PACKAGE="documentdb"
