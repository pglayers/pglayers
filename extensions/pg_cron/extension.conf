DESCRIPTION="Job scheduler for Postgres (run periodic jobs inside the database)"
REPO="https://github.com/citusdata/pg_cron.git"
LICENSE="PostgreSQL"
SHARED_PRELOAD="pg_cron"
NOTES="Requires shared_preload_libraries = 'pg_cron'"
APT_PACKAGE="cron"
# Don't echo every job's statement to the server log. Extensions that schedule
# frequent maintenance jobs (e.g. documentdb's ~2s index-build poll) otherwise
# flood stderr. Job-run history is still recorded (cron.log_run stays on).
PG_CONF="cron.log_statement = off"
