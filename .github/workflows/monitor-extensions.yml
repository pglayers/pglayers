name: Monitor Extension Versions

on:
  schedule:
    # Daily at 08:00 UTC: check for new upstream releases
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  check-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Mint a short-lived GitHub App installation token. Unlike GITHUB_TOKEN,
      # an App token is a distinct identity, so the PR it opens (and the merge
      # push) DO trigger ci.yml -- required for the build-once pipeline to build,
      # test, and promote the version bump. Unlike a PAT it is generated fresh
      # each run and expires in ~1h, so there is nothing to rotate.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Check for extension updates
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -eo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # ------------------------------------------------------------------
          # Release-artifact availability probe.
          #
          # Some extensions do not build from the git tag's source; they consume
          # a prebuilt, versioned artifact -- either a downloadable file (e.g.
          # documentdb pulls a .deb from its GitHub release assets) or a registry
          # image (e.g. pg_clickhouse does FROM a versioned upstream image).
          # Upstream routinely pushes the git *tag* days before the corresponding
          # release *binaries* are published. Bumping to such a tag yields a
          # branch that 404s / fails to pull at build time (exactly what broke
          # the documentdb v0.116-0 PR).
          #
          # When an extension.conf sets RELEASE_ASSET_URL (a file) or
          # RELEASE_IMAGE (a registry image), the monitor verifies the artifact
          # for the candidate version is actually published -- for every PG major
          # we build -- BEFORE opening a PR. If any is still missing it logs
          # explicitly and waits; the next scheduled run re-checks and opens the
          # PR once the artifact lands.
          #
          # URL tokens: %TAG% = git tag (e.g. v0.116-0)
          #             %VER% = tag without a leading "v" (e.g. 0.116-0)
          #             %PG%  = PG major (17/18/19)
          #             %ARCH%= amd64/arm64 (files only)
          asset_published() {
            url_tmpl="$1"; tag="$2"; miss=0
            for pg in 17 18 19; do
              ver_var="VERSION_${pg}"
              [ -n "${!ver_var:-}" ] || continue
              for arch in amd64 arm64; do
                url="$url_tmpl"
                url="${url//%TAG%/$tag}"
                url="${url//%VER%/${tag#v}}"
                url="${url//%PG%/$pg}"
                url="${url//%ARCH%/$arch}"
                # Ranged GET (1 byte) follows redirects and is cheap; a 200/206
                # means the object exists, 404 (or anything else) means it does not.
                code=$(curl -s -o /dev/null -w '%{http_code}' -r 0-0 -L "$url" || echo 000)
                if [ "$code" != "200" ] && [ "$code" != "206" ]; then
                  echo "    missing: $url -> HTTP $code"
                  miss=1
                fi
              done
            done
            return "$miss"
          }

          # Registry-image variant of asset_published, for extensions that FROM a
          # versioned prebuilt upstream image (e.g. pg_clickhouse ->
          # ghcr.io/clickhouse/pg_clickhouse:<pg>-<ver>) instead of downloading a
          # file. Set RELEASE_IMAGE in extension.conf to the image-ref template.
          # `docker buildx imagetools inspect` is cross-registry, resolves public
          # images anonymously, and is preinstalled on the runner. We require both
          # linux/amd64 and linux/arm64 in the manifest list, matching our build
          # matrix; a missing tag (inspect fails) reports both arches missing.
          # Same URL tokens as asset_published (%ARCH% is unused for images).
          image_published() {
            ref_tmpl="$1"; tag="$2"; miss=0
            for pg in 17 18 19; do
              ver_var="VERSION_${pg}"
              [ -n "${!ver_var:-}" ] || continue
              ref="$ref_tmpl"
              ref="${ref//%TAG%/$tag}"
              ref="${ref//%VER%/${tag#v}}"
              ref="${ref//%PG%/$pg}"
              if ! platforms=$(docker buildx imagetools inspect "$ref" \
                   --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}' 2>/dev/null); then
                echo "    missing: $ref (tag not published)"
                miss=1
                continue
              fi
              # Multi-arch manifest list: require both arches we build. A
              # single-arch image yields an empty platform list here; accept it
              # (the tag exists) rather than false-waiting forever.
              if [ -n "${platforms// /}" ]; then
                for want in linux/amd64 linux/arm64; do
                  case " $platforms " in
                    *" $want "*) ;;
                    *) echo "    missing: $ref ($want not in manifest)"; miss=1 ;;
                  esac
                done
              fi
            done
            return "$miss"
          }

          # Extensions pinned to a branch or with complex tag formats not yet handled
          SKIP_MONITOR="age pgjwt"

          # NOTE: APT-based extensions are NOT monitored here. Their versions
          # are tracked by the apt-versions lockfile (.github/apt-versions.json,
          # maintained by monitor-apt-versions.yml). This workflow only handles
          # source-built extensions that pin an upstream git tag via VERSION_XX.

          for dir in extensions/*/; do
            ext="$(basename "$dir")"

            # Skip extensions with no tagged releases
            if echo "$SKIP_MONITOR" | grep -qw "$ext"; then
              echo "SKIP $ext (pinned to branch, no releases)"
              continue
            fi

            # Source extension config
            # shellcheck disable=SC1091,SC2034
            # SC1091: dynamic path; SC2034: variables used indirectly
            source "$dir/extension.conf"

            # APT-based extensions are tracked separately, by the apt-versions
            # lockfile (.github/apt-versions.json via monitor-apt-versions.yml):
            # apt installs the latest PGDG package at build time, so there is no
            # VERSION_XX to bump here. Skip them in this (source-build) monitor.
            if [ -n "${APT_PACKAGE:-}" ]; then
              echo "SKIP $ext (APT-managed; tracked by apt-versions lockfile)"
              APT_PACKAGE=""
              continue
            fi

            # Get the current version (use first available PG version)
            current=""
            for pg in 17 18 19; do
              ver_var="VERSION_${pg}"
              ver="${!ver_var:-}"
              if [ -n "$ver" ]; then
                current="$ver"
                break
              fi
            done

            if [ -z "$current" ]; then
              echo "SKIP $ext (no VERSION_* defined)"
              continue
            fi

            # Determine tag filter pattern (for source-built extensions)
            tag_filter="${TAG_FILTER:-}"
            TAG_FILTER=""

            # Optional prebuilt-artifact probes (see asset_published /
            # image_published above). Reset per-iteration so a value sourced from
            # one extension.conf never leaks into the next.
            release_asset_url="${RELEASE_ASSET_URL:-}"
            RELEASE_ASSET_URL=""
            release_image="${RELEASE_IMAGE:-}"
            RELEASE_IMAGE=""

            # ============================================================
            # Source-built extensions: check GitHub/GitLab releases
            # ============================================================
            repo_url="$REPO"
            if echo "$repo_url" | grep -q "github.com"; then
              api_type="github"
              owner_repo=$(echo "$repo_url" | sed -n 's|.*github\.com[:/]\([^/]*/[^/.]*\).*|\1|p')
            elif echo "$repo_url" | grep -q "gitlab.com"; then
              api_type="gitlab"
              project_path=$(echo "$repo_url" | sed -n 's|.*gitlab\.com[:/]\([^.]*\).*|\1|p')
              project_encoded="${project_path//\//%2F}"
            else
              echo "SKIP $ext (unsupported host: $repo_url)"
              continue
            fi

            # Fetch latest version from upstream
            latest=""
            if [ "$api_type" = "github" ]; then
              if [ -n "$tag_filter" ]; then
                resolved_filter="$tag_filter"
                # shellcheck disable=SC2016
                # Literal ${PG} match is intentional -- it's a placeholder in TAG_FILTER
                if echo "$tag_filter" | grep -q '\${PG}'; then
                  for pg in 17 18 19; do
                    ver_var="VERSION_${pg}"
                    if [ -n "${!ver_var:-}" ]; then
                      resolved_filter="${tag_filter//\$\{PG\}/$pg}"
                      break
                    fi
                  done
                fi
                latest=$(gh api "repos/${owner_repo}/tags" --paginate --jq '.[].name' 2>/dev/null \
                  | grep -E "$resolved_filter" \
                  | grep -viE '(alpha|beta|rc|dev|pre|snapshot)' \
                  | sort -V \
                  | tail -1) || true
              else
                if gh api "repos/${owner_repo}/releases/latest" --jq '.tag_name' > /tmp/latest_ver 2>/dev/null; then
                  latest=$(cat /tmp/latest_ver)
                fi
                if [ -z "$latest" ]; then
                  latest=$(gh api "repos/${owner_repo}/tags" --paginate --jq '.[].name' 2>/dev/null \
                    | grep -viE '(alpha|beta|rc|dev|pre|snapshot)' \
                    | grep -E '^v?[0-9]' \
                    | sort -V \
                    | tail -1) || true
                fi
              fi
            elif [ "$api_type" = "gitlab" ]; then
              latest=$(curl -sf "https://gitlab.com/api/v4/projects/${project_encoded}/releases" \
                | jq -r '[.[] | select(.upcoming_release != true)] | first | .tag_name // empty' 2>/dev/null) || true
            fi

            if [ -z "$latest" ]; then
              echo "WARN $ext: could not determine latest version"
              continue
            fi

            # Compare versions
            if [ "$latest" = "$current" ]; then
              echo "OK   $ext: ${current} (up to date)"
              continue
            fi

            current_norm="${current#v}"
            latest_norm="${latest#v}"
            if [ "$current_norm" = "$latest_norm" ]; then
              echo "OK   $ext: ${current} (up to date, prefix difference only)"
              continue
            fi

            # Reject downgrades
            if [ "$(printf '%s\n%s\n' "$current_norm" "$latest_norm" | sort -V | tail -1)" = "$current_norm" ]; then
              echo "OK   $ext: ${current} (up to date, latest release ${latest} is older)"
              continue
            fi

            echo "UPDATE $ext: ${current} -> ${latest}"

            # For extensions that consume a prebuilt release artifact (a
            # downloadable file or a registry image), only open a PR once that
            # artifact is actually published upstream. Upstream can push the git
            # tag days before publishing the binaries; a PR in that gap is
            # unbuildable (404 on download / missing image tag). Log what's
            # missing and wait for the next scheduled run.
            artifact_missing=0
            if [ -n "$release_asset_url" ]; then
              echo "  probing release asset availability for ${latest}..."
              asset_published "$release_asset_url" "$latest" || artifact_missing=1
            fi
            if [ -n "$release_image" ]; then
              echo "  probing release image availability for ${latest}..."
              image_published "$release_image" "$latest" || artifact_missing=1
            fi
            if [ "$artifact_missing" -ne 0 ]; then
              echo "WAIT $ext: tag ${latest} exists upstream but its release artifacts are not published yet -- no PR opened; will retry on the next scheduled run"
              continue
            fi

            # Check if a PR already exists
            branch="deps/update-${ext}-${latest}"
            existing_pr=$(gh pr list --head "$branch" --state open --json number --jq 'length' 2>/dev/null) || existing_pr=0
            if [ "$existing_pr" -gt 0 ]; then
              echo "  PR already open for $ext, skipping"
              continue
            fi

            # Create update branch
            git push origin --delete "$branch" 2>/dev/null || true
            git checkout -b "$branch" 2>/dev/null || {
              echo "  Branch $branch already exists locally, skipping"
              git checkout main 2>/dev/null
              continue
            }

            # Update VERSION_* fields
            conf_file="extensions/${ext}/extension.conf"
            for pg in 17 18 19; do
              ver_var="VERSION_${pg}"
              old_ver="${!ver_var:-}"
              [ -z "$old_ver" ] && continue
              new_ver="$latest"
              # shellcheck disable=SC2016
              # Literal ${PG} match is intentional
              if echo "$tag_filter" | grep -q '\${PG}'; then
                pg_filter="${tag_filter//\$\{PG\}/$pg}"
                pg_latest=$(gh api "repos/${owner_repo}/tags" --paginate --jq '.[].name' 2>/dev/null \
                  | grep -E "$pg_filter" \
                  | grep -viE '(alpha|beta|rc|dev|pre|snapshot)' \
                  | sort -V \
                  | tail -1) || true
                [ -n "$pg_latest" ] && new_ver="$pg_latest"
              fi
              # Preserve the conf's existing tag-prefix convention. Some
              # upstreams tag releases as vX.Y.Z but publish the artifact the
              # Dockerfile consumes (e.g. a Docker image tag) as X.Y.Z. When the
              # pinned VERSION_XX is stored without a leading "v", keep it v-less
              # so the bumped value still matches that artifact (e.g.
              # pg_clickhouse -> ghcr.io/clickhouse/pg_clickhouse:<pg>-X.Y.Z).
              case "$old_ver" in
                v*) ;;
                *)  new_ver="${new_ver#v}" ;;
              esac
              sed -i "s|^VERSION_${pg}=.*|VERSION_${pg}=\"${new_ver}\"|" "$conf_file"
            done

            # Build PR body
            if [ "$api_type" = "github" ]; then
              release_url="https://github.com/${owner_repo}/releases/tag/${latest}"
              compare_url="https://github.com/${owner_repo}/compare/${current}...${latest}"
            else
              release_url="https://gitlab.com/${project_path}/-/releases/${latest}"
              compare_url="https://gitlab.com/${project_path}/-/compare/${current}...${latest}"
            fi

            pr_body="Upstream [${ext}](${repo_url%.git}) released "
            pr_body+="[${latest}](${release_url})."
            pr_body+=$'\n\n'
            pr_body+="**Current version:** \`${current}\`"
            pr_body+=$'\n'
            pr_body+="**New version:** \`${latest}\`"
            pr_body+=$'\n\n'
            pr_body+="[Changelog](${release_url})"
            pr_body+=" | [Compare](${compare_url})"
            pr_body+=$'\n\n'
            pr_body+="---"
            pr_body+=$'\n'
            pr_body+="*Automated by monitor-extensions workflow (source build).*"

            # Commit, push, and open PR
            git add "$conf_file"
            git commit -m "deps(${ext}): update to ${latest}"
            git push -u origin "$branch"

            if gh pr create \
              --title "deps(${ext}): update to ${latest}" \
              --body "$pr_body" \
              --base main \
              --head "$branch"; then
              gh pr merge "$branch" --auto --squash
            else
              echo "  WARN: failed to create PR for $ext (check repo Actions permissions)"
            fi

            git checkout main 2>/dev/null
          done
