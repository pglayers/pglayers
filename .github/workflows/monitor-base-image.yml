name: Monitor Base Image

on:
  schedule:
    # Every 6 hours: check if the official postgres images have been rebuilt
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  check-digests:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # Mint a short-lived GitHub App installation token. Unlike GITHUB_TOKEN,
      # an App token is a distinct identity, so the PR it opens (and the branch
      # push) DO trigger ci.yml -- required so the "Test PG 17" status check runs
      # and auto-merge can complete. With GITHUB_TOKEN, GitHub suppresses those
      # triggers, the required check never runs, the PR stays BLOCKED, and every
      # scheduled run piles another commit onto the long-lived branch.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check base image digests
        id: check
        run: |
          DIGEST_FILE=".github/base-image-digests.json"
          CHANGED_VERSIONS=""

          # Initialize if file doesn't exist
          if [ ! -f "$DIGEST_FILE" ]; then
            echo '{}' > "$DIGEST_FILE"
          fi

          for pg in 17 18 19; do
            # Map the PG major to the actual published Docker tag. PG 19 has no
            # GA tag yet, so the build (Makefile, scripts/detect-license.sh) uses
            # postgres:19beta3 -- track the same tag so beta rebuilds are caught.
            # Remove this mapping once postgres:19 goes GA.
            tag="$pg"
            [ "$pg" = "19" ] && tag="19beta3"
            image="docker.io/library/postgres:${tag}"

            # Fetch the raw manifest to a file and check the inspect exit status
            # DIRECTLY. Do NOT pipe the command into sha256sum: on failure the
            # inspect prints nothing and "'' | sha256sum" still yields the sha256
            # of empty input (e3b0c442...b855) -- a bogus "digest" that passes the
            # old non-empty guard, silently overwrites a good value, and fires a
            # spurious PR + full rebuild. On any failure/empty output, skip this
            # PG and leave the stored digest untouched.
            manifest="$(mktemp)"
            if ! docker buildx imagetools inspect --raw "$image" >"$manifest" 2>/dev/null \
               || [ ! -s "$manifest" ]; then
              echo "::warning::Failed to fetch manifest for ${image}; leaving stored digest untouched"
              rm -f "$manifest"
              continue
            fi
            # Hash the exact manifest bytes (sha256sum < file == the old
            # "docker ... | sha256sum"), so 17/18 baselines are unchanged.
            current="sha256:$(sha256sum <"$manifest" | awk '{print $1}')"
            rm -f "$manifest"

            # Stored digest is keyed by PG major, independent of the tag.
            stored=$(jq -r ".\"postgres:${pg}\" // \"\"" "$DIGEST_FILE")

            if [ "$current" != "$stored" ]; then
              echo "postgres:${pg} (${tag}) changed: ${stored:-<new>} -> ${current}"
              CHANGED_VERSIONS="${CHANGED_VERSIONS:+${CHANGED_VERSIONS} }${pg}"
              # Update the file
              jq --arg key "postgres:${pg}" --arg val "$current" \
                '.[$key] = $val' "$DIGEST_FILE" > tmp.json && mv tmp.json "$DIGEST_FILE"
            else
              echo "postgres:${pg} (${tag}) unchanged: ${current}"
            fi
          done

          echo "changed=${CHANGED_VERSIONS}" >> "$GITHUB_OUTPUT"

      - name: Create or update PR with updated digests
        if: steps.check.outputs.changed != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -eo pipefail
          changed="${{ steps.check.outputs.changed }}"
          branch="auto/base-image-update"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # The digest file is a COMPLETE snapshot of the desired state, so the
          # branch never needs prior history. Recreate it from the current main
          # (HEAD) carrying the working-tree change from the check step, as a
          # single commit, and force-push. This keeps the PR to exactly one
          # commit every run and avoids the merge-commit accumulation that a
          # reused, merge-forward branch produced.
          git checkout -B "$branch"
          git add .github/base-image-digests.json
          git commit -m "chore: base image updated (PG ${changed})"
          git push -f -u origin "$branch"

          # Ensure a PR exists and its title reflects the changed versions.
          existing_pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" \
              --title "chore: base image updated (PG ${changed})"
          else
            gh pr create \
              --title "chore: base image updated (PG ${changed})" \
              --body "The official \`postgres\` Docker images have been rebuilt for PG ${changed}.

          This PR updates the tracked digests. Once status checks pass, it will auto-merge and trigger a rebuild." \
              --head "$branch" \
              --base main
          fi

          # Enable auto-merge. The App-token push above triggers ci.yml, so the
          # required "Test PG 17" check runs and the PR merges once it passes.
          # Falls back gracefully if auto-merge is disabled on the repo.
          gh pr merge "$branch" --auto --squash \
            || echo "WARN: could not enable auto-merge (enable it in repo settings)."

      - name: Trigger rebuild for changed versions
        if: steps.check.outputs.changed != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          changed="${{ steps.check.outputs.changed }}"
          # If multiple versions changed, rebuild everything
          if [ "$(echo "$changed" | wc -w)" -gt 1 ]; then
            echo "Multiple versions changed, triggering full rebuild"
            gh workflow run ci.yml
          else
            echo "Triggering rebuild for PG ${changed}"
            gh workflow run ci.yml -f pg_version="${changed}"
          fi
